<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RQ V2 · Character Manager</title><style>body{font:16px system-ui;background:#141d2a;color:#f3f4fa;margin:0;padding:20px}main{max-width:850px;margin:auto}a{color:#a9d6ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.card{background:#243246;border:1px solid #64758d;border-radius:12px;padding:14px}.card.selected{border:2px solid #e9c16d}button{background:#e9c16d;color:#1b2433;border:0;border-radius:8px;padding:11px;cursor:pointer;font-weight:bold}button:disabled{opacity:.4}small{color:#cbd3de}li{margin:7px 0}</style><main><h1>🧑‍🤝‍🧑 Character Manager</h1><p>Choose exactly three characters for the next match-3 encounter. Your choice is stored only in this browser, not uploaded to Supabase.</p><p id="status" role="status"></p><div class="grid" id="cards"></div><p><button id="save">Save three-character party</button> <a href="combat49.html">Open match-3 →</a></p><p><a href="card-manager.html">Card Manager</a> · <a href="power-test-lab.html">Power Test Lab</a></p></main><script src="character-catalog.js"></script><script>
const catalog=RQCharacterCatalog,chosen=new Set();try{const s=JSON.parse(localStorage.getItem(catalog.storageKey));if(Array.isArray(s)&&s.length===3&&new Set(s).size===3&&s.every(i=>Number.isInteger(i)&&i>=0&&i<catalog.characters.length))s.forEach(i=>chosen.add(i));else catalog.defaultSelection.forEach(i=>chosen.add(i))}catch{catalog.defaultSelection.forEach(i=>chosen.add(i))}
const colors=['Red','Yellow','Blue','Purple','Green','Gray (support)','Ivory'];
function draw(){document.getElementById('status').textContent=chosen.size+'/3 selected · '+(chosen.size===3?'Ready to save':'Select exactly three');document.getElementById('save').disabled=chosen.size!==3;const host=document.getElementById('cards');host.replaceChildren();catalog.characters.forEach((c,i)=>{const card=document.createElement('article');card.className='card'+(chosen.has(i)?' selected':'');const heading=document.createElement('h2');heading.textContent=c.icon+' '+c.name;const bg=document.createElement('p');bg.textContent=c.background+' · '+c.max+' HP';const list=document.createElement('ul');c.powers.forEach(p=>{const li=document.createElement('li');li.textContent=p[0]+' · '+colors[p[1]]+' · '+p[2]+' energy — '+p[3];list.append(li)});const b=document.createElement('button');b.textContent=chosen.has(i)?'✓ Selected':'Select';b.onclick=()=>{if(chosen.has(i))chosen.delete(i);else if(chosen.size<3)chosen.add(i);draw()};card.append(heading,bg,list,b);host.append(card)})}
document.getElementById('save').onclick=()=>{const selection=[...chosen].sort((a,b)=>a-b);localStorage.setItem(catalog.storageKey,JSON.stringify(selection));document.getElementById('status').textContent='Party saved. Open match-3 to play with these three characters.'};draw();
</script></html>
