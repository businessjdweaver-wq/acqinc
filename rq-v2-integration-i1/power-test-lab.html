<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relentless Quest · Power Test Lab</title><style>body{background:#151a26;color:#e9ecf5;font:15px system-ui;max-width:920px;margin:30px auto;padding:0 16px}section{background:#222b3c;border:1px solid #46536a;border-radius:12px;padding:16px;margin:12px 0}button,select,input{font:inherit;background:#30435f;color:white;border:1px solid #8291aa;border-radius:5px;padding:8px;margin:5px}pre{white-space:pre-wrap;background:#101827;padding:15px;border-radius:8px}label{display:inline-block}a{color:#b5d7ff}</style><h1>Power Test Lab · Event Engine</h1><p>Local-only deterministic trigger harness. No cloud calls. This tests event matching and activation limits, not combat effects.</p><section><label>Event <select id="event"><option>damage-taken</option><option>tile-destroyed</option><option>condition-gained</option><option>turn-start</option></select></label><label>Subject <select id="subject"><option>self</option><option>ally</option><option>enemy</option><option>owned-tile</option><option>enemy-tile</option></select></label><label>Condition <select id="condition"><option>any</option><option>flying</option><option>stunned</option><option>fortified</option></select></label><button id="fire">Emit event</button><button id="reset">Reset</button></section><section><h2>Fixture: reactive defense</h2><p>When an ally takes damage while Flying, activate once per turn.</p><pre id="output"></pre></section><script src="power-events.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),events=window.RQPowerEvents;
let fired=0;
const dispatcher=events.createDispatcher({maxDepth:8,maxEvents:128,onEffect:()=>{fired++}});
dispatcher.add('reactive-defense',{mode:'reaction',event:'damage-taken',subject:'ally',condition:'flying',limit:'once-per-turn'});
function render(){$('output').textContent=JSON.stringify({scope:dispatcher.scope(),activations:fired,history:dispatcher.history},null,2)}
$('fire').onclick=()=>{try{dispatcher.emit({type:$('event').value,subject:$('subject').value,condition:$('condition').value});render()}catch(e){$('output').textContent=e.message}};
$('reset').onclick=()=>{dispatcher.advanceTurn();render()};
$('subject').value='ally';$('condition').value='flying';render();
</script></html>
