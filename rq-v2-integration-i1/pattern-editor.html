<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RQ V2 Pattern Editor</title>
<style>body{font:15px system-ui;background:#161924;color:#f1f1f5;max-width:860px;margin:30px auto;padding:0 16px}button,input,select,textarea{font:inherit}button{cursor:pointer} .grid{display:grid;grid-template-columns:repeat(9,32px);gap:3px;margin:16px 0}.cell{width:32px;height:32px;border:1px solid #596073;background:#292e40;color:white;border-radius:3px}.cell.on{background:#b6d7f3;color:#172337}.cell.center{outline:2px solid #e5bd64}label{display:inline-flex;align-items:center;gap:7px;margin:8px 16px 8px 0}textarea{width:100%;height:130px;background:#222839;color:#fff}button.action{padding:8px 14px;margin-right:8px}</style>
<h1>Card Studio · Pattern Painter</h1><p>Click cells to paint affected offsets. The outlined center is the chosen or randomly selected anchor; the center cell itself is optional.</p>
<div><button class="action" id="ring">8 neighbors</button><button class="action" id="x">X</button><button class="action" id="star">Star</button><button class="action" id="clear">Clear</button></div>
<div id="grid" class="grid" role="group" aria-label="Pattern grid"></div>
<label>Center selection <select id="mode"><option value="selected">Player selects</option><option value="random">Random</option></select></label>
<label>Number of centers <input id="count" type="number" min="1" max="100" value="1" style="width:65px"></label>
<label><input id="gain" type="checkbox" checked> Collect resources from affected tiles</label>
<label>Effect <select id="effect"><option value="destroy">Destroy</option><option value="transform">Transform</option><option value="fortify">Fortify</option><option value="amplify">Amplify</option><option value="dampen">Dampen</option><option value="lock">Lock</option><option value="unlock">Unlock</option></select></label>
<p><button class="action" id="copy">Copy power configuration</button> <button class="action" id="copyPower">Copy combat power entry</button></p><textarea id="output" readonly aria-label="Pattern JSON"></textarea>
<script>
const grid=document.getElementById('grid'),cells=new Set();
function draw(){grid.innerHTML='';for(let y=-4;y<=4;y++)for(let x=-4;x<=4;x++){const k=x+','+y,b=document.createElement('button');b.type='button';b.className='cell'+(cells.has(k)?' on':'')+(x===0&&y===0?' center':'');b.textContent=cells.has(k)?'■':'';b.setAttribute('aria-label','Offset '+x+', '+y);b.setAttribute('aria-pressed',String(cells.has(k)));b.onclick=()=>{cells.has(k)?cells.delete(k):cells.add(k);draw()};grid.append(b)}output() }
function setPattern(points){cells.clear();for(const p of points)cells.add(p.x+','+p.y);draw()}
function output(){const arr=[...cells].map(s=>{const [x,y]=s.split(',').map(Number);return {x,y}}).sort((a,b)=>a.y-b.y||a.x-b.x);document.getElementById('output').value=JSON.stringify({type:'pattern',cells:arr,centerMode:document.getElementById('mode').value,count:Math.max(1,Math.min(100,Number(document.getElementById('count').value)||1)),gainResources:document.getElementById('gain').checked,effect:document.getElementById('effect').value},null,2)}
document.getElementById('ring').onclick=()=>setPattern(Array.from({length:9},(_,i)=>({x:i%3-1,y:Math.floor(i/3)-1})).filter(p=>p.x||p.y));
document.getElementById('x').onclick=()=>setPattern([-2,-1,0,1,2].flatMap(d=>[{x:d,y:d},{x:d,y:-d}]));
document.getElementById('star').onclick=()=>setPattern([{x:0,y:0},...[-2,-1,1,2].flatMap(v=>[{x:v,y:0},{x:0,y:v}]),...[-1,1].flatMap(x=>[-1,1].map(y=>({x,y})))]);
document.getElementById('clear').onclick=()=>setPattern([]);
for(const id of ['mode','count','gain','effect'])document.getElementById(id).onchange=output;
document.getElementById('copy').onclick=async()=>{output();const t=document.getElementById('output');try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand('copy')}};
document.getElementById('copyPower').onclick=async()=>{output();const config=JSON.parse(document.getElementById('output').value);const entry=['Pattern Power',6,8,'Card Studio · Custom board pattern','card-pattern',config];const value=JSON.stringify(entry,null,2);document.getElementById('output').value=value;try{await navigator.clipboard.writeText(value)}catch(e){document.getElementById('output').select();document.execCommand('copy')}};
document.getElementById('ring').click();
</script></html>
