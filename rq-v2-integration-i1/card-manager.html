<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relentless Quest · Card Manager Prototype</title>
<style>
:root{color-scheme:dark}body{font:15px system-ui,sans-serif;background:#151a26;color:#e9ecf5;margin:0 auto;padding:22px;max-width:1080px}
h1{margin:0 0 8px}p{color:#b7c1d5}main{display:grid;grid-template-columns:minmax(250px,1fr) minmax(320px,2fr);gap:18px}
section{background:#222b3c;padding:18px;border:1px solid #46536a;border-radius:12px}label{display:block;margin:12px 0}
input,select,textarea,button{font:inherit}input,select,textarea{box-sizing:border-box;width:100%;background:#101827;color:white;border:1px solid #6d7890;border-radius:5px;padding:8px}
button{background:#354968;color:white;border:1px solid #7187a7;padding:8px 12px;border-radius:5px;cursor:pointer;margin:4px 4px 4px 0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #edc568}
.grid{display:grid;grid-template-columns:repeat(9,27px);gap:3px;margin:12px 0}.cell{height:27px;padding:0;margin:0;background:#303c52}.cell.on{background:#e5c27d;color:#171a24}.cell.center{outline:2px solid #90cfff}
.row{display:flex;gap:12px;align-items:center}.row>*{flex:1}.small{font-size:12px}.danger{border-color:#c67878}
#cards button{display:block;width:100%;text-align:left}#json{height:180px;font:12px ui-monospace,monospace}
@media(max-width:720px){main{grid-template-columns:1fr}}
</style>
<h1>Card Manager · Prototype</h1>
<p>Local-only card drafting. No Supabase reads, uploads, polling, or autosave. Export JSON to preserve your work.</p>
<main><section><h2>Cards</h2><div id="cards"></div><button id="add">New card</button><button id="exportAll">Export deck JSON</button><label>Import deck JSON<input id="importFile" type="file" accept=".json,application/json"></label><p id="status" role="status"></p></section>
<section><h2>Edit power</h2><label>Card name<input id="name" maxlength="80"></label>
<div class="row"><label>Resource color<select id="color"><option value="0">Red</option><option value="1">Yellow</option><option value="2">Blue</option><option value="3">Purple</option><option value="4">Green</option><option value="5">Gray / Support</option><option value="6">Ivory</option></select></label><label>Energy cost<input id="cost" type="number" min="0" max="100" value="8"></label></div>
<label>Description<input id="description" maxlength="240"></label>
<div class="row"><label>Effect<select id="effect"><option value="destroy">Destroy</option><option value="transform">Transform tile</option><option value="fortify">Fortify</option><option value="amplify">Amplify</option><option value="dampen">Dampen</option><option value="lock">Lock</option><option value="unlock">Unlock</option></select></label><label id="amountWrap">Strength adjustment<input id="amount" type="number" min="0" max="100" value="1"></label><label id="transformWrap" hidden>Transform into color<select id="transformColor"><option value="0">Red</option><option value="1">Yellow</option><option value="2">Blue</option><option value="3">Purple</option><option value="4">Green</option><option value="5">Gray / Support</option><option value="6">Ivory</option></select></label></div>
<div class="row"><label>Center<select id="centerMode"><option value="selected">Player selects</option><option value="random">Random</option></select></label><label>Number of centers<input id="count" type="number" min="1" max="100" value="1"></label></div>
<label><input id="gainResources" type="checkbox" checked style="width:auto"> Collect resources from changed tiles</label>
<h3>Pattern painter</h3><p class="small">Paint offsets around the outlined center.</p><button id="ring">8 neighbors</button><button id="x">X</button><button id="star">Star</button><button id="clear">Clear</button><div id="grid" class="grid"></div>
<button id="save">Save card in deck</button><button id="copyPower">Copy combat power entry</button><button id="remove" class="danger">Delete card</button>
<label>Selected card JSON<textarea id="json" readonly></textarea></label></section></main>
<script src="card-mechanics.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),M=window.RQCardMechanics;
let deck=[],selected=-1,painted=new Set();
const fields=['name','color','cost','description','effect','amount','centerMode','count','gainResources'];
const blank=()=>({id:'card-'+Date.now()+'-'+Math.random().toString(36).slice(2,8),name:'New Pattern Power',color:6,cost:8,description:'Custom pattern power',effect:'destroy',amount:1,centerMode:'selected',count:1,gainResources:true,transformColor:6,cells:M.PATTERNS.ring8});
function status(s){$('status').textContent=s}
function draw(){const g=$('grid');g.replaceChildren();for(let y=-4;y<=4;y++)for(let x=-4;x<=4;x++){const k=x+','+y,b=document.createElement('button');b.type='button';b.className='cell'+(painted.has(k)?' on':'')+(x===0&&y===0?' center':'');b.textContent=painted.has(k)?'■':'';b.setAttribute('aria-label','Offset '+x+', '+y);b.setAttribute('aria-pressed',String(painted.has(k)));b.onclick=()=>{painted.has(k)?painted.delete(k):painted.add(k);draw();preview()};g.append(b)}}
function cells(){return [...painted].map(k=>{const [x,y]=k.split(',').map(Number);return{x,y}}).sort((a,b)=>a.y-b.y||a.x-b.x)}
function read(){return{id:deck[selected]?.id||blank().id,name:$('name').value.trim(),color:Number($('color').value),cost:Number($('cost').value),description:$('description').value,effect:$('effect').value,amount:Number($('amount').value),centerMode:$('centerMode').value,count:Number($('count').value),gainResources:$('gainResources').checked,transformColor:Number($('transformColor').value),cells:cells()}}
function validate(c){if(!c.name||c.name.length>80)throw Error('Enter a card name');if(!Number.isInteger(c.color)||c.color<0||c.color>6)throw Error('Invalid resource color');if(!Number.isInteger(c.cost)||c.cost<0||c.cost>100)throw Error('Cost must be 0–100');if(!Number.isInteger(c.count)||c.count<1||c.count>100)throw Error('Centers must be 1–100');if(!Number.isFinite(c.amount)||c.amount<0||c.amount>100)throw Error('Invalid amount');if(!Number.isInteger(c.transformColor??6)||(c.transformColor??6)<0||(c.transformColor??6)>6)throw Error('Invalid transformation color');if(!['destroy','transform','fortify','amplify','dampen','lock','unlock'].includes(c.effect))throw Error('Invalid effect');if(!['random','selected'].includes(c.centerMode))throw Error('Invalid center mode');c.cells=M.pattern(c.cells);if(!c.cells.length)throw Error('Paint at least one cell');return c}
function power(c){return[c.name,c.color,c.cost,c.description,'card-pattern',{cells:c.cells,centerMode:c.centerMode,count:c.count,gainResources:c.gainResources,effect:c.effect,amount:c.amount,color:c.transformColor??6}]}
function updateEffectFields(){const effect=$('effect').value;$('amountWrap').hidden=!['amplify','dampen'].includes(effect);$('transformWrap').hidden=effect!=='transform';}
function preview(){updateEffectFields();try{$('json').value=JSON.stringify(power(validate(read())),null,2)}catch(e){$('json').value=e.message}}
function renderList(){const area=$('cards');area.replaceChildren();deck.forEach((c,i)=>{const b=document.createElement('button');b.textContent=(i===selected?'● ':'')+c.name;b.onclick=()=>select(i);area.append(b)})}
function select(i){selected=i;const c=deck[i];if(!c)return;for(const f of fields){const el=$(f);el.type==='checkbox'?el.checked=!!c[f]:el.value=c[f]}$('transformColor').value=c.transformColor??6;updateEffectFields();painted=new Set(c.cells.map(p=>p.x+','+p.y));draw();renderList();preview()}
function add(){deck.push(blank());select(deck.length-1);status('Unsaved changes remain in this browser session until exported.')}
$('add').onclick=add;
$('save').onclick=()=>{try{deck[selected]=validate(read());renderList();preview();status('Card saved in this session. Export the deck to retain it.')}catch(e){status(e.message)}};
$('remove').onclick=()=>{if(selected<0)return;deck.splice(selected,1);if(!deck.length)add();else select(Math.min(selected,deck.length-1));status('Card removed from session deck.')};
$('copyPower').onclick=async()=>{try{const text=JSON.stringify(power(validate(read())),null,2);await navigator.clipboard.writeText(text);status('Combat power entry copied.')}catch(e){status('Copy unavailable: '+e.message+'; select the JSON text manually.')}};
$('exportAll').onclick=()=>{try{const data=JSON.stringify({schema:'rq-card-deck-v1',cards:deck.map((c,i)=>i===selected?validate(read()):validate(c))},null,2);const blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='relentless-quest-in-development-card-deck.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status('Deck exported.')}catch(e){status(e.message)}};
$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>1024*1024){status('File exceeds 1 MB limit.');return}try{const data=JSON.parse(await f.text());if(data.schema!=='rq-card-deck-v1'||!Array.isArray(data.cards)||data.cards.length>100)throw Error('Unsupported deck format');const incoming=data.cards.map(c=>validate(c));if(!incoming.length)throw Error('Deck is empty');deck=incoming;select(0);status('Deck imported locally.')}catch(err){status('Import failed: '+err.message)}};
for(const id of [...fields,'transformColor'])$(id).addEventListener('input',preview);
function preset(points){painted=new Set(points.map(p=>p.x+','+p.y));draw();preview()}
$('ring').onclick=()=>preset(M.PATTERNS.ring8);$('x').onclick=()=>preset(M.PATTERNS.x);$('star').onclick=()=>preset(M.PATTERNS.star);$('clear').onclick=()=>preset([]);
add();
</script></html>
