name: Redesign Kael face
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/redesign_kael_face.py'
      - '.github/workflows/redesign-kael-face.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Apply simplified face pixel edit
        run: python scripts/redesign_kael_face.py
      - name: Commit sprite
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rq-v2-integration-i1/assets/sprites/clean/rqv2-kael-idle.png
          if ! git diff --cached --quiet; then
            git commit -m "Redesign Kael eyes and facial outlines"
            git push
          fi
