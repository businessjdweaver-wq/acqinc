name: Prepare transparent RQV2 sprites
on:
  workflow_dispatch:
  push:
    paths:
      - 'rq-v2-integration-i1/assets/sprites/rqv2-*-idle.png'
      - 'rq-v2-integration-i1/tools/prepare_sprites.py'
      - '.github/workflows/prepare-rqv2-sprites.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python rq-v2-integration-i1/tools/prepare_sprites.py
      - name: Commit prepared sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rq-v2-integration-i1/assets/sprites/clean
          if ! git diff --cached --quiet; then
            git commit -m "Prepare transparent RQV2 sprite assets"
            git push
          fi
