name: Repair Kael sprite transparency
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/clean_kael_alpha.py'
      - '.github/workflows/clean-kael-alpha.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Remove isolated background flecks without stripping astral translucency
        run: python scripts/clean_kael_alpha.py
      - name: Commit Kael sprite correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rq-v2-integration-i1/assets/sprites/clean/rqv2-kael-idle.png
          if ! git diff --cached --quiet; then
            git commit -m "Repair Kael sprite transparency"
            git push
          fi
