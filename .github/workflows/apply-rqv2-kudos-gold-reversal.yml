name: Apply RQV2 Kudos Gold Reversal
on:
  push:
    paths:
      - '.github/workflows/apply-rqv2-kudos-gold-reversal.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current RQV2 client
        run: python3 tools/apply_kudos_gold_reversal.py
      - name: Commit application update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rq-v2-integration-i1/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Reverse claimed gold when undoing Kudos"
            git push
          fi
