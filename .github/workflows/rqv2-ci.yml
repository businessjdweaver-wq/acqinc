name: RQV2 CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: RQV2 Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: rq-v2-integration-i1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run Node suites
        run: node --test card-mechanics.test.js conditions.test.js tools/check-build-version.test.js
      - name: Check displayed build version markers
        run: node tools/check-build-version.js
