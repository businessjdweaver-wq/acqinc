name: Install approved one-star sprite assets
on:
  push:
    paths:
      - 'rq-v2-integration-i1/assets/sprites/approved-one-star/*.b64'
      - '.github/workflows/install-approved-one-star-sprites.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode approved PNG assets
        run: |
          cd rq-v2-integration-i1/assets/sprites
          for f in approved-one-star/*.b64; do
            [ -f "$f" ] || continue
            base64 -d "$f" > "$(basename "$f" .b64)"
          done
      - name: Commit PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rq-v2-integration-i1/assets/sprites/rqv2-{lark,nessa,sable}-idle.png
          if ! git diff --cached --quiet; then
            git commit -m "Install approved transparent one-star character sprites"
            git push
          fi
