name: Clean Vex sprite artifact
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/clean_vex_sprite.py
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Remove isolated left-edge fragment
        run: python scripts/clean_vex_sprite.py
      - name: Commit corrected sprite
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rq-v2-integration-i1/assets/sprites/clean/rqv2-vex-idle.png
          if ! git diff --cached --quiet; then
            git commit -m "Remove stray left-edge pixels from Vex sprite"
            git push
          fi
