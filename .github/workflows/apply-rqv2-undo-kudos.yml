name: Apply RQV2 Undo Kudos patch
on:
  push:
    paths:
      - '.github/workflows/apply-rqv2-undo-kudos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch current RQV2 source
        run: python3 tools/apply_undo_kudos.py
      - name: Commit targeted change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rq-v2-integration-i1/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Enable Undo Kudos with linked focus minute reversal"
            git push
          fi
