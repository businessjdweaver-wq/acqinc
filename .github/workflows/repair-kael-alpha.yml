name: Repair Kael sprite interior alpha
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/clean_kael_alpha.py'
      - '.github/workflows/repair-kael-alpha.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Restore interior pixels from original Kael artwork
        run: python scripts/clean_kael_alpha.py
      - name: Commit corrected Kael sprite
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rq-v2-integration-i1/assets/sprites/clean/rqv2-kael-idle.png
          if ! git diff --cached --quiet; then
            git commit -m "Restore missing opaque pixels inside Kael sprite"
            git push
          fi
