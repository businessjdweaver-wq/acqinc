name: Normalize one-star sprite artwork
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/normalize_one_star_sprites.py'
      - '.github/workflows/normalize-one-star-sprites.yml'
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Normalize visible silhouette height without changing proportions
        run: python scripts/normalize_one_star_sprites.py
      - name: Commit normalized sprites
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rq-v2-integration-i1/assets/sprites/clean/rqv2-{lark,nessa,sable}-idle.png
          if ! git diff --cached --quiet; then
            git commit -m "Normalize one-star sprite visible bounds"
            git push
          fi
