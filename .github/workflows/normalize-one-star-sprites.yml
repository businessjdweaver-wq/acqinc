name: Normalize one-star sprite artwork
on:
  workflow_dispatch:
  push:
    paths:
      - 'rq-v2-integration-i1/assets/sprites/approved-one-star/*.b64'
      - '.github/workflows/normalize-one-star-sprites.yml'
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pillow
      - name: Crop sprites to visible artwork and remove isolated alpha scatter
        run: |
          python - <<'PY'
          import base64, io, pathlib
          from PIL import Image
          root=pathlib.Path('rq-v2-integration-i1/assets/sprites')
          for name in ('lark','nessa','sable'):
              source=root/'approved-one-star'/f'rqv2-{name}-idle.png.b64'
              im=Image.open(io.BytesIO(base64.b64decode(source.read_text().strip()))).convert('RGBA')
              w,h=im.size
              pixels=im.load()
              # Keep only opaque pixels connected to substantial artwork groups.
              mask={(x,y) for y in range(h) for x in range(w) if pixels[x,y][3]>=96}
              components=[]
              while mask:
                  seed=mask.pop(); group={seed}; todo=[seed]
                  while todo:
                      x,y=todo.pop()
                      for p in ((x-1,y),(x+1,y),(x,y-1),(x,y+1),(x-1,y-1),(x+1,y-1),(x-1,y+1),(x+1,y+1)):
                          if p in mask: mask.remove(p);group.add(p);todo.append(p)
                  components.append(group)
              if not components: raise RuntimeError(f'{name}: no visible pixels')
              largest=max(map(len,components))
              kept=set().union(*(c for c in components if len(c)>=max(4,largest*.008)))
              if not kept: raise RuntimeError(f'{name}: empty mask')
              # Remove stray pixels, retaining semi-transparent antialiasing adjacent to the artwork.
              expanded=set(kept)
              for x,y in list(kept):
                  for dx in (-1,0,1):
                      for dy in (-1,0,1):
                          expanded.add((x+dx,y+dy))
              for y in range(h):
                  for x in range(w):
                      if (x,y) not in expanded: pixels[x,y]=(0,0,0,0)
              xs=[p[0] for p in kept];ys=[p[1] for p in kept]
              bbox=(max(0,min(xs)-1),max(0,min(ys)-1),min(w,max(xs)+2),min(h,max(ys)+2))
              cropped=im.crop(bbox)
              target=root/f'rqv2-{name}-idle.png'
              cropped.save(target,optimize=True)
              print(name, 'source', (w,h), 'bbox',bbox,'output',cropped.size)
          PY
      - name: Commit normalized sprites
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rq-v2-integration-i1/assets/sprites/rqv2-{lark,nessa,sable}-idle.png
          if ! git diff --cached --quiet; then
            git commit -m "Normalize one-star sprite visible bounds"
            git push
          fi
