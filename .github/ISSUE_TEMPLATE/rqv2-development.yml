name: RQV2 development task
description: Define a scoped task for Relentless Quest V2.
title: "[RQV2] "
body:
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Describe the outcome and list observable conditions for completion.
    validations:
      required: true
  - type: textarea
    id: expected-files
    attributes:
      label: Expected files
      description: List repository-relative paths and flag shared files that need an owner.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List blocking issue references and prerequisites, or enter None.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - Release blocker
        - P1 - Next
        - P2 - Backlog
    validations:
      required: true
  - type: dropdown
    id: effort
    attributes:
      label: Effort level
      options:
        - Low - Scoped and independently verifiable
        - Medium - Bounded change with integration work
        - High - Design, shared logic, or data changes
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification requirements
      description: List test commands, browser scenarios if applicable, and expected results.
    validations:
      required: true
  - type: textarea
    id: approval
    attributes:
      label: Approval requirements
      description: Identify any approval needed before implementation or integration. Enter None when routine integration review is sufficient.
    validations:
      required: true
